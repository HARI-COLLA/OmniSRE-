apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: omnisre-prod-eks
  region: ap-south-1
  version: "1.31"

managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    iam:
      withAddonPolicies:
        ebs: true
        cloudWatch: true
