# Alertmanager Configuration Snippet for OmniSRE
# Merge this into your existing Alertmanager configuration (e.g. values.yaml of kube-prometheus-stack or alertmanager.yaml)

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace', 'pod']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 12h
  receiver: 'omnisre-agent'
  routes:
    # Route all Kubernetes infrastructure & workload alerts directly to OmniSRE
    - match_re:
        alertname: ".*(OOM|CrashLoop|Down|Unhealthy|Memory|HighTraffic|Saturation).*"
      receiver: 'omnisre-agent'
      continue: true

receivers:
  - name: 'omnisre-agent'
    webhook_configs:
      - url: 'http://omnisre.monitoring.svc.cluster.local:8000/webhook'
        send_resolved: true
        http_config:
          # If API_AUTH_ENABLED is true, pass the token or header:
          # authorization:
          #   credentials: "Bearer YOUR_ADMIN_API_KEY"
          follow_redirects: true
