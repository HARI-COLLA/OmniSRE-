replicaCount: 1

image:
  repository: 251128026767.dkr.ecr.ap-south-1.amazonaws.com/omnisre
  pullPolicy: IfNotPresent
  tag: "1.0.7"

service:
  type: ClusterIP
  port: 8000

config:
  appEnv: "production"
  aiProvider: "mock_heuristic" # Options: mock_heuristic, gemini, openai
  geminiApiKey: ""
  openaiApiKey: ""
  k8sInCluster: true
  k8sMockMode: false
  autoRemediationEnabled: true
  prometheusUrl: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
  slackWebhookUrl: ""
  discordWebhookUrl: ""
  databaseUrl: "sqlite:///app/data/omnisre.db"
  apiAuthEnabled: false
  adminApiKey: ""
  haLeaderElection: false

persistence:
  enabled: false # Set true for persistent EBS/EFS storage on AWS EKS
  size: 2Gi
  storageClassName: ""

policies:
  createConfigMap: false
  content: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: omnisre-agent-sa
