replicaCount: 1

image:
  repository: omnisre/agent
  pullPolicy: IfNotPresent
  tag: "1.0.0"

service:
  type: ClusterIP
  port: 8000

config:
  appEnv: "production"
  aiProvider: "mock_heuristic" # Options: mock_heuristic, gemini, openai
  geminiApiKey: ""
  openaiApiKey: ""
  k8sInCluster: true
  k8sMockMode: false
  autoRemediationEnabled: true
  prometheusUrl: "http://prometheus-kube-prometheus-prometheus.monitoring.svc:9090"
  slackWebhookUrl: ""
  discordWebhookUrl: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

rbac:
  create: true

serviceAccount:
  create: true
  name: omnisre-agent-sa
