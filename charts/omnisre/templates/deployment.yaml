apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omnisre.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omnisre.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "omnisre.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omnisre.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: AI_PROVIDER
              value: {{ .Values.config.aiProvider | quote }}
            - name: GEMINI_API_KEY
              value: {{ .Values.config.geminiApiKey | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.config.openaiApiKey | quote }}
            - name: K8S_IN_CLUSTER
              value: {{ .Values.config.k8sInCluster | quote }}
            - name: K8S_MOCK_MODE
              value: {{ .Values.config.k8sMockMode | quote }}
            - name: AUTO_REMEDIATION_ENABLED
              value: {{ .Values.config.autoRemediationEnabled | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: SLACK_WEBHOOK_URL
              value: {{ .Values.config.slackWebhookUrl | quote }}
            - name: DISCORD_WEBHOOK_URL
              value: {{ .Values.config.discordWebhookUrl | quote }}
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: API_AUTH_ENABLED
              value: {{ .Values.config.apiAuthEnabled | quote }}
            - name: ADMIN_API_KEY
              value: {{ .Values.config.adminApiKey | quote }}
            - name: HA_LEADER_ELECTION
              value: {{ .Values.config.haLeaderElection | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
            {{- if .Values.policies.createConfigMap }}
            - name: policies-volume
              mountPath: /app/config
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data-volume
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "omnisre.fullname" . }}-pvc
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- if .Values.policies.createConfigMap }}
        - name: policies-volume
          configMap:
            name: {{ include "omnisre.fullname" . }}-policies
        {{- end }}
