apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-payment-service
  namespace: default
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment-api
        image: public.ecr.aws/docker/library/python:3.11-alpine
        command: ["python", "-c"]
        args:
        - |
          import http.server, socketserver
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"Payment Service OK")
          with socketserver.TCPServer(("", 8080), Handler) as httpd:
              print("Serving payment API on port 8080...")
              httpd.serve_forever()
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "64Mi"
            cpu: "100m"
          requests:
            memory: "32Mi"
            cpu: "50m"
