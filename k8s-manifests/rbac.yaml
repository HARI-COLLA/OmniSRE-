apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-incident-agent-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-incident-agent-role
rules:
  # Pod inspection & restart permissions
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services"]
    verbs: ["get", "list", "watch", "delete"]
  # Deployment inspection & scaling permissions
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-incident-agent-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-incident-agent-role
subjects:
  - kind: ServiceAccount
    name: ai-incident-agent-sa
    namespace: monitoring
